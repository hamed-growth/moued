<dialog class="mission-sheet" id="mission-sheet" aria-labelledby="sheet-title">
  <div class="mission-sheet__body">
    <button class="mission-sheet__close" type="button" data-sheet-close aria-label="بستن">×</button>
    <div class="mission-sheet__icon"><svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg></div>
    <h2 id="sheet-title"></h2><p id="sheet-description"></p>
    <p class="mission-sheet__details"><span id="sheet-time"></span><span id="sheet-points"></span></p>
    <p id="sheet-status" role="status"></p>
    <button class="button" type="button" id="sheet-action">انجام دادم</button>
  </div>
</dialog>
